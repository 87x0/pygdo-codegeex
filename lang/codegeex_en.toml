codegeex_welcome_title = "Welcome to CodeGeeX"
codegeex_welcome_text = "Home of Team CGX: X (Pilot) and Khedr (AL #3). Built on PyGDO, by hackers, for learners. Under construction."


codegeex_overview_title = "CodeGeeX - For You!"
codegeex_overview_intro = "CodeGeeX is free online learning material for everyone who wants to understand computers from the bits up: short videos, readable lessons and hands-on challenges. A WeChall division, made by gizmore and X, with Khedr as your guide."
codegeex_overview_what_title = "What we want"
codegeex_overview_what_text = "Learning IT should feel like a game, not like a manual. Every lesson explains one idea, shows it in real code, and ends with something you can try yourself. No paywall, no fluff."
codegeex_overview_chapters_title = "The chapters"
codegeex_overview_chapters_text = "00 Intro and shared stuff · 01 Development environments · 02 Encodings (binary, base64, ASCII, UTF-8) · 03 Operating systems · 04 Libraries · 05 Services · 06 Hardware and electronics · 07 Reverse engineering · 08 Hacking · 09 Cracking (SQL injection, XSS) · 10 Code concepts · 11 Programming languages · 12 Hardware · 13 Networking · 14 Web development · 70 Math · 80 Frameworks · 90 Implement something."
codegeex_overview_how_title = "How it works"
codegeex_overview_how_text = "Watch the video, read the lesson, then solve the challenge. Solved challenges count on WeChall. Stuck? Ask Khedr for a hint: you get nudges, never the answer. We teach fishing, not fish."
codegeex_overview_who_title = "Who it is for"
codegeex_overview_who_text = "Beginners who never opened a terminal, students who want the why behind the code, and old hackers who miss the classic CGX challenges. Everyone starts at chapter 00."
