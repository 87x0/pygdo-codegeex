<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
  <title id="t">CGX · CodeGeeX</title>
  <desc id="d">Team CGX logo: green CGX badge, the word CodeGeeX shrinking to CGX, and the line A WeChall division</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dff8f"/><stop offset="1" stop-color="#00e65a"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"DejaVu Sans Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;font-weight:700}</style>
  </defs>
  <rect width="1600" height="700" rx="56" fill="#080c08"/>
  <!-- badge (same design as the favicon) -->
  <g transform="translate(60 60)">
    <rect x="19" y="19" width="442" height="442" rx="80" fill="none" stroke="#00e65a" stroke-width="17" filter="url(#soft)"/>
    <text class="mono" x="246" y="291" font-size="190" text-anchor="middle" fill="#005a23">CGX</text>
    <text class="mono" x="240" y="285" font-size="190" text-anchor="middle" fill="url(#glow)">CGX</text>
    <rect x="84" y="375" width="312" height="15" fill="#00e65a"/>
  </g>
  <!-- wordmark: CodeGeeX shrinks to CGX and back (6s loop, pure SVG) -->
  <g class="mono" font-size="148">
    <text x="616" y="306" fill="#005a23">C<animate attributeName="x" values="616;616;616;616;616" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
    <text x="705" y="306" fill="#005a23">o<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="794" y="306" fill="#005a23">d<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="883" y="306" fill="#005a23">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="972" y="306" fill="#005a23">G<animate attributeName="x" values="972;972;705;705;972" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
    <text x="1061" y="306" fill="#005a23">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="1150" y="306" fill="#005a23">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="1239" y="306" fill="#005a23">X<animate attributeName="x" values="1239;1239;794;794;1239" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
    <text x="610" y="300" fill="url(#glow)">C<animate attributeName="x" values="610;610;610;610;610" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
    <text x="699" y="300" fill="url(#glow)">o<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="788" y="300" fill="url(#glow)">d<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="877" y="300" fill="url(#glow)">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="966" y="300" fill="url(#glow)">G<animate attributeName="x" values="966;966;699;699;966" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
    <text x="1055" y="300" fill="url(#glow)">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="1144" y="300" fill="url(#glow)">e<animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1"/></text>
    <text x="1233" y="300" fill="url(#glow)">X<animate attributeName="x" values="1233;1233;788;788;1233" dur="6s" repeatCount="indefinite" keyTimes="0;0.33;0.5;0.83;1" calcMode="spline" keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1;.6 0 .2 1"/></text>
  </g>
  <!-- bottom line -->
  <text class="mono" x="800" y="640" font-size="56" text-anchor="middle" fill="#e6edf3" letter-spacing="4">A WeChall division</text>
