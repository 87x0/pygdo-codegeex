codegeex_map_intro = "Every chapter of the almanac is a realm. Walk the path from 00 upwards: read the pages, solve the challenges, earn XP and climb from Noob to Grandpa Khedr."
codegeex_map_guide = "Start at 00. Click a realm to open its lessons. Progress, XP and locked realms are coming next."
